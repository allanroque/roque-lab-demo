---
# =========================================================================
# Playbook: REMEDIATION-POSTGRESQL
# =========================================================================
# Acionado pelo WF-AUTOHEAL-POSTGRESQL quando PostgresDown fira.
# Restaura postgresql: unmask + enable + start. Falha -> set_stats(erro)+fail.
# =========================================================================
- name: REMEDIATION-POSTGRESQL — restart postgresql
  hosts: "{{ target_host | default('all') | regex_replace(':[0-9]+$', '') }}"
  become: true
  gather_facts: false
  vars:
    _alertname: "{{ alertname | default('PostgresDown') }}"
    _service: "{{ postgres_service_name | default('postgresql') }}"

  tasks:
    - name: Bloco de remediacao
      block:
        - name: Estado antes
          ansible.builtin.command: "systemctl is-active {{ _service }}"
          register: svc_before
          changed_when: false
          failed_when: false

        - name: Desmascarar, habilitar e iniciar {{ _service }}
          ansible.builtin.systemd:
            name: "{{ _service }}"
            masked: false
            enabled: true
            state: started

        - name: Confirmar estado pos-remediacao
          ansible.builtin.command: "systemctl is-active {{ _service }}"
          register: svc_after
          changed_when: false
          failed_when: false

        - name: Falhar se {{ _service }} nao ficou ativo
          ansible.builtin.fail:
            msg: "{{ _service }} continua inativo apos remediacao (estado: {{ svc_after.stdout | default('desconhecido') }})"
          when: svc_after.stdout != 'active'

        - name: Exportar SUCESSO
          ansible.builtin.set_stats:
            data:
              stats_remediation_success: true
              stats_remediation_service: "{{ _service }}"
              stats_remediation_host: "{{ inventory_hostname }}"
              stats_remediation_state_before: "{{ svc_before.stdout | default('?') }}"
              stats_remediation_state_after: "{{ svc_after.stdout }}"

      rescue:
        - name: Exportar ERRO (antes de falhar o job)
          ansible.builtin.set_stats:
            data:
              stats_remediation_success: false
              stats_remediation_service: "{{ _service }}"
              stats_remediation_host: "{{ inventory_hostname }}"
              stats_error_task: "{{ ansible_failed_task.name | default('?') }}"
              stats_error_msg: "{{ ansible_failed_result.msg | default('falha desconhecida') }}"

        - name: Forcar status failed (dispara aresta failure do workflow)
          ansible.builtin.fail:
            msg: "Remediacao de {{ _service }} falhou: {{ ansible_failed_result.msg | default('?') }}"
