---
# Playbook: Deploy servidor Infra-Interna (Edge/Lojas/PDV)
#
# Serviços:
#   - Rsyslog (concentrador de logs do site)
#   - Chrony (servidor NTP local)
#   - TFTP (backup de configs de switches)
#   - Nginx (painel web interativo do site)
#
# Variáveis para Survey do AAP:
#   target_hosts     - Grupo alvo: infra_interna (todos), loja1, loja2, etc.
#   site_name        - Nome do site (ex: "Loja Centro SP 042")
#   site_id          - ID do site (ex: "042")
#   ntp_upstream     - Servidor NTP upstream (default: "a.ntp.br")
#   syslog_retention - Dias de retenção de logs (default: "30")
#   site_network     - Rede local do site (default: "192.168.100.0/24")
#   pdv_server_ip    - IP do servidor PDV da loja
#   store_switches   - Lista de switches em YAML:
#     - hostname: rtr1-loja1
#       ip: 10.100.1.101
#       model: Cisco IOSv
#     - hostname: rtr2-loja1
#       ip: 10.100.1.102
#       model: Cisco IOSv

- name: Deploy servidor Infra-Interna - Edge
  hosts: "{{ target_hosts | default('infra_interna') }}:&infra_interna"
  gather_facts: true
  become: true

  vars:
    site_name: "{{ site_name | default('Loja Demo') }}"
    site_id: "{{ site_id | default('001') }}"
    ntp_upstream: "{{ ntp_upstream | default('a.ntp.br') }}"
    syslog_retention: "{{ syslog_retention | default('30') }}"
    site_network: "{{ site_network | default('192.168.100.0/24') }}"
    tftp_dir: "/var/lib/tftpboot"
    web_dir: "/usr/share/nginx/html"

  tasks:
    # --- Syslog (Rsyslog) ---

    - name: Instalar rsyslog
      ansible.builtin.dnf:
        name: rsyslog
        state: present

    - name: Configurar rsyslog para receber logs remotos
      ansible.builtin.template:
        src: templates/infra_rsyslog.conf.j2
        dest: /etc/rsyslog.d/10-edge-remote.conf
        mode: "0644"
      notify: Reiniciar rsyslog

    - name: Criar diretório de logs remotos
      ansible.builtin.file:
        path: /var/log/remote
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Habilitar e iniciar rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: started
        enabled: true

    # --- NTP Local (Chrony) ---

    - name: Instalar chrony
      ansible.builtin.dnf:
        name: chrony
        state: present

    - name: Configurar chrony como servidor NTP local
      ansible.builtin.template:
        src: templates/infra_chrony.conf.j2
        dest: /etc/chrony.conf
        mode: "0644"
      notify: Reiniciar chrony

    - name: Habilitar e iniciar chrony
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    # --- TFTP ---

    - name: Instalar servidor TFTP
      ansible.builtin.dnf:
        name: tftp-server
        state: present

    - name: Criar diretórios TFTP para backups
      ansible.builtin.file:
        path: "{{ tftp_dir }}/{{ item }}"
        state: directory
        owner: nobody
        group: nobody
        mode: "0777"
      loop:
        - configs
        - firmware

    - name: Habilitar e iniciar TFTP
      ansible.builtin.systemd:
        name: tftp.socket
        state: started
        enabled: true

    # --- Painel Web (Nginx) ---

    - name: Instalar nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Criar diretório de dados do dashboard
      ansible.builtin.file:
        path: "{{ web_dir }}/data"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy do painel web interativo
      ansible.builtin.template:
        src: templates/infra_dashboard.html.j2
        dest: "{{ web_dir }}/index.html"
        mode: "0644"
      notify: Reiniciar nginx

    - name: Deploy da configuração Nginx
      ansible.builtin.template:
        src: templates/pos_nginx_main.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
      notify: Reiniciar nginx

    - name: Remover configuração default do Nginx
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reiniciar nginx

    - name: Deploy do virtual host Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/infra-dashboard.conf
        content: |
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
        mode: "0644"
      notify: Reiniciar nginx

    - name: Permitir Nginx conectar em serviços de rede (SELinux)
      ansible.builtin.command:
        cmd: setsebool -P httpd_can_network_connect 1
      changed_when: false

    - name: Habilitar e iniciar nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    # --- Validação ---

    - name: Verificar status dos serviços
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: services_status
      loop:
        - rsyslog
        - chronyd
        - tftp.socket
        - nginx

    - name: Exibir status dos serviços
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.status.ActiveState }}"
      loop: "{{ services_status.results }}"

    - name: Exibir link de acesso do painel
      ansible.builtin.debug:
        msg:
          - "====================================="
          - "Infra Interna - {{ site_name }} ({{ site_id }})"
          - "====================================="
          - "Painel Web: http://{{ ansible_host }}/"
          - "Syslog:     UDP/TCP {{ ansible_host }}:514"
          - "NTP:        {{ ansible_host }}:123"
          - "TFTP:       {{ ansible_host }}:69"
          - "====================================="

  handlers:
    - name: Reiniciar rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted

    - name: Reiniciar chrony
      ansible.builtin.systemd:
        name: chronyd
        state: restarted

    - name: Reiniciar nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
