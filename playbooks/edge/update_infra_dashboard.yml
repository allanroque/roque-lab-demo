---
# Playbook: Coleta de dados e atualização do dashboard Infra-Interna
#
# Playbook leve para rodar periodicamente. Coleta status real dos
# switches Cisco, servidor PDV e infra-interna, e atualiza o HTML.
#
# Variáveis para Survey do AAP:
#   target_hosts  - Grupo da loja: loja1, loja2, etc.
#   site_name     - Nome do site
#   site_id       - ID do site
#   pdv_server_ip - IP público/acessível do PDV (para links no dashboard)

# --- Play 1: Coletar dados dos switches Cisco ---

- name: Coletar status dos switches Cisco
  hosts: "{{ target_hosts | default('cisco') }}:&cisco"
  gather_facts: false

  tasks:
    - name: Coletar facts do dispositivo
      cisco.ios.ios_facts:
        gather_subset:
          - hardware
          - config
      register: cisco_facts

    - name: Verificar SNMP
      cisco.ios.ios_command:
        commands:
          - show running-config | include snmp-server community
      register: snmp_check

    - name: Verificar NTP
      cisco.ios.ios_command:
        commands:
          - show ntp status
      register: ntp_check

    - name: Verificar DNS
      cisco.ios.ios_command:
        commands:
          - show running-config | include name-server
      register: dns_check

    - name: Verificar Banner
      cisco.ios.ios_command:
        commands:
          - show running-config | include banner
      register: banner_check

    - name: Verificar VLANs
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_check

    - name: Armazenar dados coletados
      ansible.builtin.set_fact:
        switch_data:
          hostname: "{{ cisco_facts.ansible_facts.ansible_net_hostname | default(inventory_hostname) }}"
          ip: "{{ ansible_host }}"
          model: "{{ cisco_facts.ansible_facts.ansible_net_model | default('Cisco IOS') }}"
          serial: "{{ cisco_facts.ansible_facts.ansible_net_serialnum | default('N/A') }}"
          version: "{{ cisco_facts.ansible_facts.ansible_net_version | default('N/A') }}"
          image: "{{ cisco_facts.ansible_facts.ansible_net_image | default('N/A') }}"
          snmp_configured: "{{ snmp_check.stdout[0] | length > 0 }}"
          ntp_configured: "{{ 'synchronised' in (ntp_check.stdout[0] | lower) or 'synchronized' in (ntp_check.stdout[0] | lower) }}"
          ntp_status: "{{ ntp_check.stdout[0] | regex_search('Clock is (.+)', '\\1') | default(['N/A']) | first }}"
          dns_configured: "{{ dns_check.stdout[0] | length > 0 }}"
          banner_configured: "{{ banner_check.stdout[0] | length > 0 }}"
          vlans_configured: "{{ 'VLAN' in vlan_check.stdout[0] }}"
          vlans_count: "{{ vlan_check.stdout[0] | regex_findall('\\d+\\s+\\w+') | length }}"

# --- Play 2: Coletar dados do servidor PDV ---

- name: Coletar status do servidor PDV
  hosts: "{{ target_hosts | default('pdv') }}:&pdv"
  gather_facts: true
  become: true

  tasks:
    - name: Verificar status dos serviços PDV
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      loop:
        - nginx
        - mariadb
        - pos-api
      register: pdv_svc_check
      changed_when: false
      failed_when: false

    - name: Coletar uso de disco
      ansible.builtin.command:
        cmd: df -h --output=pcent /
      register: disk_check
      changed_when: false

    - name: Coletar processos principais
      ansible.builtin.command:
        cmd: ps aux --sort=-%mem --no-headers
      register: proc_check
      changed_when: false

    - name: Armazenar dados do PDV
      ansible.builtin.set_fact:
        pdv_data:
          hostname: "{{ ansible_hostname }}"
          ip: "{{ ansible_default_ipv4.address | default(ansible_host) }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          cpu_count: "{{ ansible_processor_vcpus }}"
          memory_total_mb: "{{ ansible_memtotal_mb }}"
          memory_free_mb: "{{ ansible_memfree_mb }}"
          disk_usage: "{{ disk_check.stdout_lines[-1] | trim }}"
          uptime_seconds: "{{ ansible_uptime_seconds | default(0) }}"
          services:
            nginx: "{{ pdv_svc_check.results[0].stdout | default('inactive') }}"
            mariadb: "{{ pdv_svc_check.results[1].stdout | default('inactive') }}"
            pos_api: "{{ pdv_svc_check.results[2].stdout | default('inactive') }}"
          top_processes: "{{ proc_check.stdout_lines[:10] }}"

# --- Play 3: Coletar dados do infra e gerar dashboard ---

- name: Atualizar dashboard Infra-Interna
  hosts: "{{ target_hosts | default('infra_interna') }}:&infra_interna"
  gather_facts: true
  become: true

  vars:
    site_name: "{{ site_name | default('Loja Demo') }}"
    site_id: "{{ site_id | default('001') }}"
    ntp_upstream: "{{ ntp_upstream | default('a.ntp.br') }}"
    syslog_retention: "{{ syslog_retention | default('30') }}"
    site_network: "{{ site_network | default('192.168.100.0/24') }}"
    pdv_server_ip: "{{ pdv_server_ip | default('') }}"

  tasks:
    - name: Verificar status dos serviços infra
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      loop:
        - rsyslog
        - chronyd
        - tftp.socket
        - nginx
      register: infra_svc_check
      changed_when: false
      failed_when: false

    - name: Verificar sincronização NTP
      ansible.builtin.command:
        cmd: chronyc tracking
      register: chrony_check
      changed_when: false
      failed_when: false

    - name: Coletar uso de disco
      ansible.builtin.command:
        cmd: df -h --output=pcent /
      register: disk_check
      changed_when: false

    - name: Montar lista de switches coletados
      ansible.builtin.set_fact:
        collected_switches: >-
          {{
            groups['cisco'] | default([])
            | intersect(groups[target_hosts] | default([]))
            | map('extract', hostvars, 'switch_data')
            | select('defined')
            | list
          }}

    - name: Montar dados do PDV coletado
      ansible.builtin.set_fact:
        collected_pdv: >-
          {{
            groups['pdv'] | default([])
            | intersect(groups[target_hosts] | default([]))
            | map('extract', hostvars, 'pdv_data')
            | select('defined')
            | first
            | default({})
          }}

    - name: Atualizar dashboard HTML
      ansible.builtin.template:
        src: templates/infra_dashboard_live.html.j2
        dest: /usr/share/nginx/html/index.html
        mode: "0644"

    - name: Exibir resumo da coleta
      ansible.builtin.debug:
        msg:
          - "====================================="
          - "Dashboard atualizado - {{ site_name }} ({{ site_id }})"
          - "====================================="
          - "Switches coletados: {{ collected_switches | length }}"
          - "PDV: {{ collected_pdv.hostname | default('não coletado') }}"
          - "Serviços infra: {{ infra_svc_check.results | map(attribute='item') | list | join(', ') }}"
          - "Painel: http://{{ ansible_host }}/"
          - "====================================="
