---
# Playbook: Configurar usuário local em dispositivos Cisco (Edge)
#
# Variáveis para Survey do AAP:
#   net_username  - Nome do usuário (ex: "admin_edge")
#   net_password  - Senha do usuário
#   net_privilege - Nível de privilégio 0-15 (default: "15")
#   net_user_state - present ou absent (default: "present")

- name: Configurar usuário em switches/routers Cisco - Edge
  hosts: "{{ target_hosts | default('cisco') }}"
  gather_facts: false

  tasks:
    - name: Pular hosts que não são Cisco
      ansible.builtin.meta: end_host
      when: ansible_network_os is not defined or ansible_network_os != 'cisco.ios.ios'

    - name: Configurar usuário local
      cisco.ios.ios_config:
        commands:
          - "username {{ net_username }} privilege {{ net_privilege | default('15') }} secret {{ net_password }}"
      when: net_user_state | default('present') == 'present'

    - name: Remover usuário local
      cisco.ios.ios_config:
        commands:
          - "no username {{ net_username }}"
      when: net_user_state | default('present') == 'absent'

    - name: Salvar configuração
      cisco.ios.ios_config:
        save_when: modified

    - name: Validar usuários configurados
      cisco.ios.ios_command:
        commands:
          - show running-config | include username
      register: user_output

    - name: Exibir usuários configurados
      ansible.builtin.debug:
        msg: "{{ user_output.stdout_lines }}"
