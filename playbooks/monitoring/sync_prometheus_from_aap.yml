---
# ==============================================================================
# Playbook: Sincronizar targets do Prometheus a partir do inventário do AAP
# ==============================================================================
# FASE 1 — Apenas SO (node_exporter) guiado pelo grupo do inventário.
#
# Fluxo:
#   1. Lê o inventory {{ aap_inventory_name }} via awx.awx.export
#   2. Extrai os hosts do grupo {{ monitoring_group }}
#   3. Renderiza um arquivo de targets no formato file_sd_configs do Prometheus
#   4. Escreve o arquivo no diretório bind-mounted do container
#   5. Prometheus auto-reload via refresh_interval (sem chamada de reload)
#
# Pré-requisito único no prometheus.yml (aplicar UMA vez):
#
#   - job_name: 'linux-nodes'
#     file_sd_configs:
#       - files:
#           - '/etc/prometheus/targets/linux-nodes.yml'
#         refresh_interval: 30s
#
# Vars Survey AAP:
#   - monitoring_group       (default: infra)
#   - monitoring_job_name    (default: linux-nodes)
#   - monitoring_port        (default: 9100)
#
# Credential esperada:
#   Tipo "Red Hat Ansible Automation Platform" anexada ao Job Template.
#   As vars controller_host/username/password/oauthtoken são injetadas
#   automaticamente pelo AAP ao job. Rodando local, exportar via env.
# ==============================================================================

- name: Sync Prometheus targets from AAP inventory (FASE 1 — SO)
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    # ── Parâmetros do AAP (Survey) ────────────────────────────────────────
    aap_inventory_name: "INV-ROQUE-LAB"
    aap_organization: "ROQUE"

    # ── Parâmetros de monitoramento (Survey) ──────────────────────────────
    monitoring_group: "infra"
    monitoring_job_name: "linux-nodes"
    monitoring_port: 9100

    # ── Labels adicionais aplicados ao conjunto de targets ────────────────
    monitoring_extra_labels:
      group: "{{ monitoring_group }}"
      env: "lab"
      managed_by: "aap"
      aap_inventory: "{{ aap_inventory_name }}"

    # ── Destino do arquivo no host onde o Prometheus roda ────────────────
    # Caminho relativo ao repo lab-containers (ajustar no Mac ou via extra_vars)
    monitoring_targets_dir: >-
      {{ lookup('ansible.builtin.env', 'MONITORING_TARGETS_DIR',
         default='/Users/aroque/Documents/redhat/ansible/projetos/aap-lab-demo/lab-containers/prometheus/targets') }}
    monitoring_target_filename: "{{ monitoring_job_name }}.yml"

    # ── Prefixo da API do Controller no gateway do AAP 2.6 ───────────────
    # Em AWX/Tower antigos use "/api/v2"; em AAP 2.5+/2.6 o padrão é
    # /api/controller/v2 (roteado pelo gateway).
    aap_api_prefix: "/api/controller/v2"

  pre_tasks:
    # ── Guard-rail: validar parâmetros de entrada ────────────────────────
    - name: "VALIDAÇÃO · parâmetros obrigatórios"
      ansible.builtin.assert:
        that:
          - aap_inventory_name | length > 0
          - monitoring_group | length > 0
          - monitoring_job_name | length > 0
          - monitoring_port | int > 0
        fail_msg: "Parâmetros obrigatórios ausentes (inventory, group, job, port)"
      tags: [always, validate]

  tasks:
    # ─────────────────────────────────────────────────────────────────────
    # 1. Resolver credenciais do AAP (tolerante a 3 convenções)
    # ─────────────────────────────────────────────────────────────────────
    # AAP 2.5+/2.6  -> aap_hostname / aap_username / aap_password / aap_token / aap_validate_certs
    # AAP 2.4 / AWX -> controller_host / controller_username / controller_password / controller_oauthtoken / controller_verify_ssl
    # Tower clássico -> tower_host / tower_username / tower_password / tower_oauthtoken / tower_verify_ssl
    - name: "AAP · resolver host/usuário/senha/token da credential"
      ansible.builtin.set_fact:
        _aap_host: >-
          {{ lookup('ansible.builtin.vars', 'aap_hostname', default='')
             or lookup('ansible.builtin.vars', 'controller_host', default='')
             or lookup('ansible.builtin.vars', 'tower_host', default='') }}
        _aap_user: >-
          {{ lookup('ansible.builtin.vars', 'aap_username', default='')
             or lookup('ansible.builtin.vars', 'controller_username', default='')
             or lookup('ansible.builtin.vars', 'tower_username', default='') }}
        _aap_pass: >-
          {{ lookup('ansible.builtin.vars', 'aap_password', default='')
             or lookup('ansible.builtin.vars', 'controller_password', default='')
             or lookup('ansible.builtin.vars', 'tower_password', default='') }}
        _aap_token: >-
          {{ lookup('ansible.builtin.vars', 'aap_token', default='')
             or lookup('ansible.builtin.vars', 'controller_oauthtoken', default='')
             or lookup('ansible.builtin.vars', 'tower_oauthtoken', default='') }}
        _aap_verify: >-
          {{ lookup('ansible.builtin.vars', 'aap_validate_certs', default=none)
             | default(lookup('ansible.builtin.vars', 'controller_verify_ssl', default=none), true)
             | default(lookup('ansible.builtin.vars', 'tower_verify_ssl', default=none), true)
             | default(false, true) }}
      tags: [api, always]

    - name: "AAP · validar que a credential foi injetada"
      ansible.builtin.assert:
        that:
          - _aap_host | length > 0
          - (_aap_user | length > 0 and _aap_pass | length > 0) or (_aap_token | length > 0)
        fail_msg: >-
          Credential AAP não foi injetada. Anexe CRED-AAP-ROQUE ao Job Template.
          Vars esperadas: aap_hostname/controller_host/tower_host + user/pass OU token.
      tags: [api, always]

    - name: "AAP · montar URL base e modo de auth"
      ansible.builtin.set_fact:
        _api_base: "{{ _aap_host | regex_replace('/$', '') }}{{ aap_api_prefix }}"
        _use_token: "{{ _aap_token | length > 0 }}"
      tags: [api, always]

    - name: "AAP · montar cabeçalhos de autenticação"
      ansible.builtin.set_fact:
        _aap_headers: >-
          {{ {'Authorization': 'Bearer ' ~ _aap_token,
              'Accept': 'application/json'}
             if _use_token
             else {'Accept': 'application/json'} }}
      tags: [api, always]

    - name: "AAP · exibir contexto resolvido (debug)"
      ansible.builtin.debug:
        msg:
          - "Base URL  : {{ _api_base }}"
          - "Usuário   : {{ _aap_user if not _use_token else '(usando OAuth token)' }}"
          - "Auth mode : {{ 'Bearer token' if _use_token else 'Basic auth' }}"
          - "Verify SSL: {{ _aap_verify }}"
      tags: [api, always]

    - name: "AAP · testar conectividade (ping)"
      ansible.builtin.uri:
        url: "{{ _api_base }}/ping/"
        method: GET
        url_username: "{{ _aap_user if not _use_token else omit }}"
        url_password: "{{ _aap_pass if not _use_token else omit }}"
        force_basic_auth: "{{ not _use_token }}"
        headers: "{{ _aap_headers }}"
        validate_certs: "{{ _aap_verify | bool }}"
        return_content: true
        status_code: [200]
      register: _aap_ping
      tags: [api]

    # ─────────────────────────────────────────────────────────────────────
    # 2. Obter ID do inventário pelo nome
    # ─────────────────────────────────────────────────────────────────────
    - name: "AAP · buscar inventário '{{ aap_inventory_name }}'"
      ansible.builtin.uri:
        url: "{{ _api_base }}/inventories/?name={{ aap_inventory_name | urlencode }}"
        method: GET
        url_username: "{{ _aap_user if not _use_token else omit }}"
        url_password: "{{ _aap_pass if not _use_token else omit }}"
        force_basic_auth: "{{ not _use_token }}"
        headers: "{{ _aap_headers }}"
        validate_certs: "{{ _aap_verify | bool }}"
        return_content: true
        status_code: [200]
      register: _inv_resp
      tags: [api, inventory]

    - name: "AAP · extrair ID do inventário"
      ansible.builtin.set_fact:
        _inv_match: >-
          {{ (_inv_resp.json.results | default([]))
             | selectattr('name', 'equalto', aap_inventory_name)
             | list | first | default({}) }}
      tags: [api, inventory]

    - name: "AAP · falhar se inventário não foi encontrado"
      ansible.builtin.assert:
        that:
          - _inv_match is mapping
          - (_inv_match.id | default(0)) | int > 0
        fail_msg: >-
          Inventory '{{ aap_inventory_name }}' não localizado em
          {{ _api_base }}/inventories/. Verifique nome exato e
          permissões (View Inventory) da credential AAP.
      tags: [api, inventory]

    - name: "AAP · set_fact ID do inventário"
      ansible.builtin.set_fact:
        _inv_id: "{{ _inv_match.id }}"
      tags: [api, inventory]

    # ─────────────────────────────────────────────────────────────────────
    # 3. Obter ID do grupo dentro do inventário
    # ─────────────────────────────────────────────────────────────────────
    - name: "AAP · buscar grupo '{{ monitoring_group }}' no inventário"
      ansible.builtin.uri:
        url: >-
          {{ _api_base }}/inventories/{{ _inv_id }}/groups/?name={{ monitoring_group | urlencode }}
        method: GET
        url_username: "{{ _aap_user if not _use_token else omit }}"
        url_password: "{{ _aap_pass if not _use_token else omit }}"
        force_basic_auth: "{{ not _use_token }}"
        headers: "{{ _aap_headers }}"
        validate_certs: "{{ _aap_verify | bool }}"
        return_content: true
        status_code: [200]
      register: _grp_resp
      tags: [api, group]

    - name: "AAP · extrair ID do grupo"
      ansible.builtin.set_fact:
        _grp_match: >-
          {{ (_grp_resp.json.results | default([]))
             | selectattr('name', 'equalto', monitoring_group)
             | list | first | default({}) }}
      tags: [api, group]

    - name: "AAP · falhar se grupo não existe"
      ansible.builtin.assert:
        that:
          - _grp_match is mapping
          - (_grp_match.id | default(0)) | int > 0
        fail_msg: >-
          Grupo '{{ monitoring_group }}' não encontrado no inventário
          '{{ aap_inventory_name }}' (id={{ _inv_id }}).
      tags: [api, group]

    - name: "AAP · set_fact ID do grupo"
      ansible.builtin.set_fact:
        _grp_id: "{{ _grp_match.id }}"
      tags: [api, group]

    # ─────────────────────────────────────────────────────────────────────
    # 4. Listar hosts do grupo (paginado)
    # ─────────────────────────────────────────────────────────────────────
    - name: "AAP · listar hosts do grupo (até 200)"
      ansible.builtin.uri:
        url: "{{ _api_base }}/groups/{{ _grp_id }}/hosts/?page_size=200"
        method: GET
        url_username: "{{ _aap_user if not _use_token else omit }}"
        url_password: "{{ _aap_pass if not _use_token else omit }}"
        force_basic_auth: "{{ not _use_token }}"
        headers: "{{ _aap_headers }}"
        validate_certs: "{{ _aap_verify | bool }}"
        return_content: true
        status_code: [200]
      register: _hosts_resp
      tags: [api, hosts]

    - name: "AAP · consolidar lista de hosts"
      ansible.builtin.set_fact:
        monitoring_hosts: >-
          {{ _hosts_resp.json.results | default([]) | map(attribute='name') | list }}
      tags: [api, hosts]

    - name: "AAP · falhar se grupo está vazio"
      ansible.builtin.assert:
        that:
          - monitoring_hosts | length > 0
        fail_msg: >-
          Grupo '{{ monitoring_group }}' está vazio no inventário
          '{{ aap_inventory_name }}'. Nada a renderizar.
      tags: [api, hosts]

    - name: "AAP · exibir hosts descobertos"
      ansible.builtin.debug:
        msg:
          - "Inventory : {{ aap_inventory_name }} (id={{ _inv_id }})"
          - "Grupo     : {{ monitoring_group }} (id={{ _grp_id }})"
          - "Hosts     : {{ monitoring_hosts }}"
          - "Qtde      : {{ monitoring_hosts | length }}"
      tags: [api, hosts]

    # ─────────────────────────────────────────────────────────────────────
    # 3. Preparar diretório de destino e renderizar targets
    # ─────────────────────────────────────────────────────────────────────
    - name: "PROMETHEUS · garantir diretório de targets"
      ansible.builtin.file:
        path: "{{ monitoring_targets_dir }}"
        state: directory
        mode: "0755"
      tags: [write]

    - name: "PROMETHEUS · backup do arquivo anterior (se existir)"
      ansible.builtin.copy:
        src: "{{ monitoring_targets_dir }}/{{ monitoring_target_filename }}"
        dest: "{{ monitoring_targets_dir }}/{{ monitoring_target_filename }}.bak"
        mode: "0644"
        remote_src: true
      failed_when: false
      changed_when: false
      tags: [write, backup]

    - name: "PROMETHEUS · renderizar arquivo de targets ({{ monitoring_target_filename }})"
      ansible.builtin.template:
        src: templates/linux_nodes_targets.yml.j2
        dest: "{{ monitoring_targets_dir }}/{{ monitoring_target_filename }}"
        mode: "0644"
      register: _target_render
      tags: [write]

    # ─────────────────────────────────────────────────────────────────────
    # 4. Exportar stats para workflow / exibir banner final
    # ─────────────────────────────────────────────────────────────────────
    - name: "STATS · exportar metadados para workflow"
      ansible.builtin.set_stats:
        data:
          stats_prom_inventory: "{{ aap_inventory_name }}"
          stats_prom_group: "{{ monitoring_group }}"
          stats_prom_job: "{{ monitoring_job_name }}"
          stats_prom_targets_count: "{{ monitoring_hosts | length }}"
          stats_prom_file: "{{ monitoring_targets_dir }}/{{ monitoring_target_filename }}"
          stats_prom_changed: "{{ _target_render.changed }}"
        per_host: false
      tags: [stats]

    - name: "BANNER · resumo da sincronização"
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "  SYNC PROMETHEUS ← AAP INVENTORY — concluído"
          - "=================================================================="
          - "Inventory AAP  : {{ aap_inventory_name }} (org={{ aap_organization }})"
          - "Grupo alvo     : {{ monitoring_group }}"
          - "Job Prometheus : {{ monitoring_job_name }}"
          - "Porta          : {{ monitoring_port }}"
          - "Hosts render.  : {{ monitoring_hosts | length }}"
          - "Arquivo        : {{ monitoring_targets_dir }}/{{ monitoring_target_filename }}"
          - "Alterado?      : {{ _target_render.changed }}"
          - "------------------------------------------------------------------"
          - "Prometheus recarrega targets via refresh_interval (file_sd_configs)."
          - "Nenhuma chamada /-/reload necessária."
          - "=================================================================="
      tags: [banner]
