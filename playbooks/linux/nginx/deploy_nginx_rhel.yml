---
# ============================================================
# Deploy Parasol Insurance Website com Nginx no RHEL 9
# ============================================================
# Variáveis para Survey do AAP:
#   website_repo: URL do repositório Git do website
#   nginx_root:   Diretório raiz do Nginx (default: /usr/share/nginx/html)
#   nginx_port:   Porta HTTP do Nginx (default: 80)
# ============================================================
- name: Deploy Parasol Insurance Website to RHEL 9 with Nginx
  hosts: all
  ignore_unreachable: true
  become: true
  gather_facts: true

  vars:
    website_repo: "https://github.com/ansible-tmm/parasol-website.git"
    nginx_root: "/usr/share/nginx/html"
    temp_dir: "/tmp/parasol-website"
    nginx_port: 80

  pre_tasks:
    - name: Aguardar SSH estar disponível
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5
      tags:
        - nginx
        - pre

  tasks:
    - name: Parar e desabilitar Apache se estiver ativo (conflito porta 80)
      ansible.builtin.systemd:
        name: httpd
        state: stopped
        enabled: false
      failed_when: false
      changed_when: httpd_stop.changed | default(false)
      register: httpd_stop
      tags:
        - nginx
        - pre

    - name: Instalar git para clonar o repositório
      ansible.builtin.dnf:
        name: git
        state: present
      tags:
        - nginx
        - install

    - name: Instalar Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
      tags:
        - nginx
        - install

    - name: Remover conteúdo anterior do diretório html do Nginx
      ansible.builtin.file:
        path: "{{ nginx_root }}/"
        state: absent
      tags:
        - nginx
        - deploy

    - name: Garantir que diretório html do Nginx existe
      ansible.builtin.file:
        path: "{{ nginx_root }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      tags:
        - nginx
        - deploy

    - name: Clonar repositório do website Parasol
      ansible.builtin.git:
        repo: "{{ website_repo }}"
        dest: "{{ temp_dir }}"
        version: main
        force: true
      tags:
        - nginx
        - deploy

    - name: Copiar arquivos do website para diretório do Nginx
      ansible.builtin.copy:
        src: "{{ temp_dir }}/"
        dest: "{{ nginx_root }}/"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      tags:
        - nginx
        - deploy

    - name: Restaurar contextos SELinux no diretório html do Nginx
      ansible.builtin.command:
        cmd: restorecon -Rv /usr/share/nginx/html
      changed_when: false
      tags:
        - nginx
        - selinux

    - name: Garantir permissões corretas no diretório raiz do Nginx
      ansible.builtin.file:
        path: /usr/share/nginx/html
        owner: root
        group: root
        mode: "0755"
        recurse: true
      tags:
        - nginx
        - deploy

    - name: Remover diretório temporário
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: absent
      tags:
        - nginx
        - cleanup

    # ── Firewalld ────────────────────────────────────────────────────────────
    - name: Coletar facts de servicos
      ansible.builtin.service_facts:
      tags:
        - nginx
        - firewall

    - name: Permitir porta do Nginx no firewalld
      ansible.posix.firewalld:
        port: "{{ nginx_port }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      when:
        - ansible_facts.services['firewalld.service'] is defined
        - ansible_facts.services['firewalld.service']['state'] == 'running'
      tags:
        - nginx
        - firewall

    - name: Garantir Nginx habilitado e em execução
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
      tags:
        - nginx
        - service

    # ── Validação e URL de acesso ────────────────────────────────────────────
    - name: Aguardar Nginx responder na porta HTTP
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ nginx_port }}"
        state: started
        timeout: 30
      tags:
        - nginx
        - validate

    - name: Validar resposta HTTP do website (smoke test)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_port }}/"
        return_content: false
        status_code: [200, 301, 302]
      register: _nginx_smoke
      retries: 5
      delay: 3
      until: _nginx_smoke.status is defined and _nginx_smoke.status in [200, 301, 302]
      tags:
        - nginx
        - validate

    - name: Construir URLs de acesso à aplicação
      ansible.builtin.set_fact:
        app_url_ip: "http://{{ ansible_default_ipv4.address }}{{ ':' ~ nginx_port if nginx_port | int != 80 else '' }}/"
        app_url_fqdn: "http://{{ ansible_fqdn }}{{ ':' ~ nginx_port if nginx_port | int != 80 else '' }}/"
      tags:
        - nginx
        - validate

    - name: Exibir URL de acesso à aplicação
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════"
          - "   Parasol Insurance Website disponível!"
          - "════════════════════════════════════════════════════════════"
          - "   Host        : {{ ansible_fqdn }}"
          - "   Porta       : {{ nginx_port }}"
          - "   HTTP status : {{ _nginx_smoke.status }}"
          - ""
          - "   🌐 Acesse por IP   : {{ app_url_ip }}"
          - "   🌐 Acesse por FQDN : {{ app_url_fqdn }}"
          - "════════════════════════════════════════════════════════════"
      tags:
        - nginx
        - report

  post_tasks:
    - name: Exportar URLs para workflow (set_stats)
      ansible.builtin.set_stats:
        aggregate: false
        data:
          stats_nginx_host: "{{ ansible_fqdn }}"
          stats_nginx_ip: "{{ ansible_default_ipv4.address }}"
          stats_nginx_port: "{{ nginx_port }}"
          stats_app_url_ip: "{{ app_url_ip }}"
          stats_app_url_fqdn: "{{ app_url_fqdn }}"
          stats_http_status: "{{ _nginx_smoke.status }}"
          stats_phase: "nginx_ready"
      tags:
        - nginx
        - report
