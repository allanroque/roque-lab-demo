---
# ──────────────────────────────────────────────────────────────────────────────
# Firewalld — Liberar/remover portas (permanente + runtime)
#
# Uso típico no AAP:
#   - Survey define `firewall_ports` (CSV: "80,8080,8081" ou "80/tcp,443/tcp")
#   - Survey opcional para `firewall_protocol`, `firewall_zone`, `firewall_state`
#   - Final imprime o `firewall-cmd --list-all` da zona
#
# Variáveis (pensadas para Survey do AAP):
#   target_hosts       : grupo/host alvo (default: all)
#   firewall_ports     : portas em CSV. Ex: "80,8080" ou "80/tcp,443/tcp,53/udp"
#   firewall_protocol  : tcp|udp — usado quando a porta vem sem protocolo (default: tcp)
#   firewall_zone      : zona do firewalld (default: public)
#   firewall_state     : enabled|disabled — liberar ou remover a regra (default: enabled)
#   firewall_permanent : true|false — manter entre reboots (default: true)
# ──────────────────────────────────────────────────────────────────────────────

- name: Firewalld — Gerenciar liberação de portas
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: true

  vars:
    firewall_ports: "80,8080,8081"
    firewall_protocol: "tcp"
    firewall_zone: "public"
    firewall_state: "enabled"
    firewall_permanent: true

  pre_tasks:
    - name: Validar variáveis de entrada
      ansible.builtin.assert:
        that:
          - firewall_ports is defined
          - (firewall_ports | string | length) > 0
          - firewall_protocol in ['tcp', 'udp']
          - firewall_zone is defined
          - firewall_state in ['enabled', 'disabled']
        fail_msg: >-
          Informe firewall_ports (CSV), firewall_protocol (tcp|udp),
          firewall_zone e firewall_state (enabled|disabled).
      tags:
        - always

    - name: Normalizar lista de portas (aceita "80" ou "80/tcp")
      ansible.builtin.set_fact:
        _firewall_ports_normalized: >-
          {{
            (firewall_ports | string).split(',')
            | map('trim')
            | reject('equalto', '')
            | map('regex_replace', '^(\d+)$', '\1/' ~ firewall_protocol)
            | list
          }}
      tags:
        - always

    - name: Mostrar parâmetros da execução
      ansible.builtin.debug:
        msg:
          - "Host          : {{ inventory_hostname }}"
          - "Zona          : {{ firewall_zone }}"
          - "Ação          : {{ firewall_state }}"
          - "Permanente    : {{ firewall_permanent }}"
          - "Portas        : {{ _firewall_ports_normalized | join(', ') }}"
      tags:
        - firewall

  tasks:
    # ── Pacote e serviço ─────────────────────────────────────────────────────
    - name: Garantir firewalld instalado
      ansible.builtin.package:
        name: firewalld
        state: present
      tags:
        - firewall
        - packages

    - name: Garantir firewalld habilitado e em execução
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
      tags:
        - firewall
        - services

    # ── Aplicação das regras ─────────────────────────────────────────────────
    - name: "Aplicar regra ({{ firewall_state }}) para cada porta na zona {{ firewall_zone }}"
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ firewall_zone }}"
        permanent: "{{ firewall_permanent | bool }}"
        immediate: true
        state: "{{ firewall_state }}"
      loop: "{{ _firewall_ports_normalized }}"
      loop_control:
        label: "{{ item }} ({{ firewall_state }})"
      tags:
        - firewall

  post_tasks:
    # ── Coleta do status final ───────────────────────────────────────────────
    - name: Coletar estado do serviço firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --state
      register: _fw_state
      changed_when: false
      failed_when: false
      tags:
        - firewall
        - report

    - name: "Coletar configuração da zona {{ firewall_zone }}"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ firewall_zone }}"
          - --list-all
      register: _fw_zone
      changed_when: false
      tags:
        - firewall
        - report

    - name: Coletar zona default
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --get-default-zone
      register: _fw_default_zone
      changed_when: false
      tags:
        - firewall
        - report

    - name: Exportar métricas para o workflow (AAP set_stats)
      ansible.builtin.set_stats:
        data:
          firewalld_state: "{{ _fw_state.stdout | default('unknown') | trim }}"
          firewalld_zone: "{{ firewall_zone }}"
          firewalld_ports_processed: "{{ _firewall_ports_normalized }}"
          firewalld_action: "{{ firewall_state }}"
        per_host: true
      tags:
        - firewall
        - report

    - name: Banner final — status do firewalld
      ansible.builtin.debug:
        msg: >-
          {{
            [
              '==================================================',
              '  FIREWALLD — ' ~ (ansible_facts['fqdn'] | default(inventory_hostname)),
              '==================================================',
              'Serviço        : ' ~ (_fw_state.stdout | default('desconhecido') | trim),
              'Zona default   : ' ~ (_fw_default_zone.stdout | default('?') | trim),
              'Zona alvo      : ' ~ firewall_zone,
              'Ação aplicada  : ' ~ firewall_state,
              'Portas         : ' ~ (_firewall_ports_normalized | join(', ')),
              '--------------------------------------------------',
              'firewall-cmd --zone=' ~ firewall_zone ~ ' --list-all:'
            ] + (_fw_zone.stdout_lines | default([]))
          }}
      tags:
        - firewall
        - report
