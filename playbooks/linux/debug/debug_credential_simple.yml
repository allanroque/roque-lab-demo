---
# Lab: imprime utilizador e senhas injetadas pela credencial do AAP (stdout = segredo).
# Job Template: playbook playbooks/linux/debug/debug_credential_simple.yml

- name: Credencial máquina — user e senha (prático)
  hosts: all
  gather_facts: false

  tasks:
    - name: Mostrar user, senha SSH e chave (como injeta o Controller)
      ansible.builtin.debug:
        msg:
          ansible_user: "{{ ansible_user | default('(não definido)') }}"
          ansible_password: "{{ ansible_password | default('(não definido)') }}"
          ansible_ssh_pass: "{{ ansible_ssh_pass | default('(não definido)') }}"
          ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default('(não definido)') }}"
          ansible_ssh_private_key_pem: "{{ ansible_ssh_private_key | default('(não definido)') }}"
