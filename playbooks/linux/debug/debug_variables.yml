---
# Ver debug_credential_simple.yml (comentários no topo).
- name: Credencial máquina — user, senha e AWS (prático)
  hosts: all
  gather_facts: false

  tasks:
    - name: SSH e chave (Controller / credencial máquina)
      ansible.builtin.debug:
        msg:
          ansible_user: "{{ ansible_user | default('(not defined)') }}"
          ansible_password: "{{ ansible_password | default('(not defined)') }}"
          ansible_ssh_pass: "{{ ansible_ssh_pass | default('(not defined)') }}"
          ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default('(not defined)') }}"
          ansible_ssh_private_key_pem: "{{ ansible_ssh_private_key | default('(not defined)') }}"

    - name: AWS — ambiente (credencial tipo Amazon Web Services no JT)
      ansible.builtin.debug:
        msg:
          AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('(not defined)', true) }}"
          AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('(not defined)', true) }}"
          AWS_SESSION_TOKEN: "{{ lookup('env', 'AWS_SESSION_TOKEN') | default('(not defined)', true) }}"
          AWS_SECURITY_TOKEN: "{{ lookup('env', 'AWS_SECURITY_TOKEN') | default('(not defined)', true) }}"
          AWS_DEFAULT_REGION: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('(not defined)', true) }}"
          AWS_REGION: "{{ lookup('env', 'AWS_REGION') | default('(not defined)', true) }}"
