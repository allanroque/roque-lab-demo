---
# ============================================================
# Debug: credencial máquina + utilizador (AAP) — saída segura
# ============================================================
# Objetivo
#   Provar que o Controller injeta variáveis de ligação/autenticação a partir
#   da credencial associada ao Job Template, e o utilizador da torre (Tower/AAP).
#
# O que aparece no stdout
#   - Identidade de SSH/sudo: ansible_user, ansible_become_user, ansible_become_method
#   - Rede/execução: ansible_connection, ansible_host, ansible_python_interpreter
#   - Caminho da chave (não o conteúdo): ansible_ssh_private_key_file
#   - Senhas: apenas se estão definidas e o comprimento (nunca o valor em claro)
#   - Chave privada "inline" (se a variável ansible_ssh_private_key existir): só definida + comprimento
#   - Utilizador no Controller: tower_user_id, tower_user_name
#
# O que NÃO incluímos (pedido “só senha e utilizador”)
#   - tower_job_id, tower_job_template_*, schedules, workflow_* (metadados de job;
#     disponíveis noutros playbooks se precisar)
#
# Variáveis opcionais (Survey / -e)
#   (nenhuma obrigatória)
#
# Tags: credential, tower_user
# ============================================================

- name: Credencial SSH/sudo e utilizador AAP (metadados seguros)
  hosts: all
  gather_facts: false

  tasks:
    - name: Resumo — utilizador, ligação e credencial (sem segredos em claro)
      ansible.builtin.debug:
        msg:
          ansible_connection: "{{ ansible_connection | default('(não definido)') }}"
          ansible_host: "{{ ansible_host | default('(não definido)') }}"
          ansible_user: "{{ ansible_user | default('(não definido)') }}"
          ansible_python_interpreter: "{{ ansible_python_interpreter | default('(não definido)') }}"
          ansible_become_user: "{{ ansible_become_user | default('(não definido)') }}"
          ansible_become_method: "{{ ansible_become_method | default('(não definido)') }}"
          ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default('(não definido)') }}"
          ansible_ssh_common_args_definidas: "{{ ansible_ssh_common_args is defined }}"
          ansible_password_definida: "{{ ansible_password is defined }}"
          ansible_password_comprimento: "{{ ansible_password | default('', true) | length }}"
          ansible_ssh_pass_definida: "{{ ansible_ssh_pass is defined }}"
          ansible_ssh_pass_comprimento: "{{ ansible_ssh_pass | default('', true) | length }}"
          ansible_become_password_definida: "{{ ansible_become_password is defined }}"
          ansible_become_password_comprimento: "{{ ansible_become_password | default('', true) | length }}"
          ansible_ssh_private_key_conteudo_definido: "{{ ansible_ssh_private_key is defined }}"
          ansible_ssh_private_key_conteudo_comprimento: "{{ ansible_ssh_private_key | default('', true) | length }}"
          tower_user_id: "{{ tower_user_id | default('(não definido — fora do AAP)') }}"
          tower_user_name: "{{ tower_user_name | default('(n/d)') }}"
      tags:
        - credential
        - tower_user
        - debug
