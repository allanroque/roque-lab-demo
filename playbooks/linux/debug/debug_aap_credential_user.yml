---
# ============================================================
# Debug: credencial AAP com exibição CUSTOMIZÁVEL de senhas
# ============================================================
# Objetivo
#   Mostrar o que o Controller injeta (ansible_user, ansible_password, etc.)
#   sem necessariamente revelar o segredo completo no stdout — útil para
#   demonstração ao cliente e políticas de segurança.
#
# Survey / extra-vars (principal)
#   debug_password_display (string, default: partial)
#     - partial        → primeiros N + * + últimos M (ex.: re******9)
#     - masked         → <redacted>
#     - length_only    → [12 caracteres]
#     - asterisk_same_len → mesma quantidade de *
#     - plain          → valor integral (APENAS lab / auditoria explícita)
#   debug_password_partial_prefix (int, default: 2)
#   debug_password_partial_suffix (int, default: 1)
#   debug_long_secret_threshold (int, default: 128)
#     Segredos maiores (ex. PEM inline) não são expandidos exceto em plain.
#
# Tags: credential_plain, env, replicate_network_style
# ============================================================

- name: Credencial AAP — exibição configurável de senhas (lab / demo)
  hosts: all
  gather_facts: true

  vars:
    debug_password_display: partial
    debug_password_partial_prefix: 2
    debug_password_partial_suffix: 1
    debug_long_secret_threshold: 128

  tasks:
    - name: Calcular texto seguro — ansible_password
      ansible.builtin.set_fact:
        _disp_ansible_password: "{{ lookup('template', 'secret_value_formatted.j2') }}"
      vars:
        secret_value: "{{ ansible_password | default('', true) }}"
        password_display: "{{ debug_password_display }}"
        partial_prefix: "{{ debug_password_partial_prefix }}"
        partial_suffix: "{{ debug_password_partial_suffix }}"
        long_secret_threshold: "{{ debug_long_secret_threshold }}"

    - name: Calcular texto seguro — ansible_ssh_pass
      ansible.builtin.set_fact:
        _disp_ansible_ssh_pass: "{{ lookup('template', 'secret_value_formatted.j2') }}"
      vars:
        secret_value: "{{ ansible_ssh_pass | default('', true) }}"
        password_display: "{{ debug_password_display }}"
        partial_prefix: "{{ debug_password_partial_prefix }}"
        partial_suffix: "{{ debug_password_partial_suffix }}"
        long_secret_threshold: "{{ debug_long_secret_threshold }}"

    - name: Calcular texto seguro — become_password
      ansible.builtin.set_fact:
        _disp_ansible_become_password: "{{ lookup('template', 'secret_value_formatted.j2') }}"
      vars:
        secret_value: "{{ ansible_become_password | default('', true) }}"
        password_display: "{{ debug_password_display }}"
        partial_prefix: "{{ debug_password_partial_prefix }}"
        partial_suffix: "{{ debug_password_partial_suffix }}"
        long_secret_threshold: "{{ debug_long_secret_threshold }}"

    - name: Calcular texto seguro — auth_pass
      ansible.builtin.set_fact:
        _disp_ansible_auth_pass: "{{ lookup('template', 'secret_value_formatted.j2') }}"
      vars:
        secret_value: "{{ ansible_auth_pass | default('', true) }}"
        password_display: "{{ debug_password_display }}"
        partial_prefix: "{{ debug_password_partial_prefix }}"
        partial_suffix: "{{ debug_password_partial_suffix }}"
        long_secret_threshold: "{{ debug_long_secret_threshold }}"

    - name: Calcular texto seguro — PEM/chave inline
      ansible.builtin.set_fact:
        _disp_ansible_ssh_private_key_pem: "{{ lookup('template', 'secret_value_formatted.j2') }}"
      vars:
        secret_value: "{{ ansible_ssh_private_key | default('', true) }}"
        password_display: "{{ debug_password_display }}"
        partial_prefix: "{{ debug_password_partial_prefix }}"
        partial_suffix: "{{ debug_password_partial_suffix }}"
        long_secret_threshold: "{{ debug_long_secret_threshold }}"

    - name: >-
        Valores injetados — senhas conforme debug_password_display (default partial)
      ansible.builtin.debug:
        msg:
          _formato_pedido: "{{ debug_password_display }}"
          ansible_connection: "{{ ansible_connection | default('(not defined)') }}"
          ansible_host: "{{ ansible_host | default('(not defined)') }}"
          ansible_user: "{{ ansible_user | default('(not defined)') }}"
          ansible_python_interpreter: "{{ ansible_python_interpreter | default('(not defined)') }}"
          ansible_password: "{{ _disp_ansible_password }}"
          ansible_ssh_pass: "{{ _disp_ansible_ssh_pass }}"
          ansible_become_user: "{{ ansible_become_user | default('(not defined)') }}"
          ansible_become_method: "{{ ansible_become_method | default('(not defined)') }}"
          ansible_become_password: "{{ _disp_ansible_become_password }}"
          ansible_auth_pass: "{{ _disp_ansible_auth_pass }}"
          ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default('(not defined)') }}"
          ansible_ssh_private_key_pem: "{{ _disp_ansible_ssh_private_key_pem }}"
      tags:
        - credential_plain
        - debug

    - name: >-
        Réplica estilo módulo rede — password/auth_pass também formatados
      ansible.builtin.set_fact:
        _disp_login_password: "{{ lookup('template', 'secret_value_formatted.j2') }}"
      vars:
        secret_value: "{{ ansible_ssh_pass | default(ansible_password | default('', true), true) }}"
        password_display: "{{ debug_password_display }}"
        partial_prefix: "{{ debug_password_partial_prefix }}"
        partial_suffix: "{{ debug_password_partial_suffix }}"
        long_secret_threshold: "{{ debug_long_secret_threshold }}"

    - name: >-
        Dicionário análogo a módulos (username / password / auth_pass)
      ansible.builtin.debug:
        msg:
          username: "{{ ansible_user | default('') }}"
          password: "{{ _disp_login_password }}"
          authorize: true
          auth_pass: "{{ _disp_ansible_auth_pass }}"
      tags:
        - replicate_network_style
        - debug

    - name: Subset de ansible_env no host alvo
      ansible.builtin.debug:
        msg:
          USER: "{{ ansible_env.USER | default('(n/a)') }}"
          HOME: "{{ ansible_env.HOME | default('(n/a)') }}"
          PATH: "{{ ansible_env.PATH | default('(n/a)') }}"
      tags:
        - env
        - debug
