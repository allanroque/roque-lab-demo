---
# ============================================================
# Debug: credencial AAP em CLARO (lab / prova de conceito segurança)
# ============================================================
# AVISO
#   Este playbook imprime SENHAS e dados sensíveis no stdout do job AAP
#   (histórico, exportação de logs, APIs). Use apenas em ambiente controlado
#   e com política de retenção/RBAC alinhada.
#
# Objetivo
#   Replicar o padrão que módulos de rede (e integrações) usam com variáveis
#   injetadas pela credencial máquina, por exemplo:
#     username: "{{ ansible_user }}"
#     password: "{{ ansible_ssh_pass }}"   # ou ansible_password
#     authorize: yes
#     auth_pass: "{{ ansible_auth_pass }}"
#
#   A saída mostra os VALORES reais (não só “definido?”) para auditoria ou
#   alinhamento com o cliente sobre o que o Controller expõe à play.
#
# Variáveis mostradas (quando a credencial/inventário as definirem)
#   - ansible_user, ansible_connection, ansible_host, ansible_python_interpreter
#   - ansible_password, ansible_ssh_pass (muitas credenciais SSH preenchem uma ou outra)
#   - ansible_become_user, ansible_become_method, ansible_become_password
#   - ansible_auth_pass (contexto tipo rede / enable)
#   - ansible_ssh_private_key_file; conteúdo chave se existir ansible_ssh_private_key
#
# Opcional: subset de variáveis de ambiente no alvo (gather_facts necessário)
#
# Tags: credential_plain, env, replicate_network_style
# ============================================================

- name: Credencial em claro e réplica estilo módulo de rede (LAB)
  hosts: all
  gather_facts: true

  tasks:
    - name: Valores crus injetados pela credencial / inventário (SENSÍVEL)
      ansible.builtin.debug:
        msg:
          ansible_connection: "{{ ansible_connection | default('(não definido)') }}"
          ansible_host: "{{ ansible_host | default('(não definido)') }}"
          ansible_user: "{{ ansible_user | default('(não definido)') }}"
          ansible_python_interpreter: "{{ ansible_python_interpreter | default('(não definido)') }}"
          ansible_password: "{{ ansible_password | default('(não definido)') }}"
          ansible_ssh_pass: "{{ ansible_ssh_pass | default('(não definido)') }}"
          ansible_become_user: "{{ ansible_become_user | default('(não definido)') }}"
          ansible_become_method: "{{ ansible_become_method | default('(não definido)') }}"
          ansible_become_password: "{{ ansible_become_password | default('(não definido)') }}"
          ansible_auth_pass: "{{ ansible_auth_pass | default('(não definido)') }}"
          ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default('(não definido)') }}"
          ansible_ssh_private_key_pem: "{{ ansible_ssh_private_key | default('(não definido)') }}"
      tags:
        - credential_plain
        - debug

    - name: >-
        Réplica de dicionário como uso típico em módulos (username/password/auth_pass)
      ansible.builtin.debug:
        msg:
          username: "{{ ansible_user | default('') }}"
          password: "{{ ansible_ssh_pass | default(ansible_password | default('')) }}"
          authorize: true
          auth_pass: "{{ ansible_auth_pass | default('') }}"
      tags:
        - replicate_network_style
        - debug

    - name: Subset de ansible_env no host alvo (sem filtrar segredos genéricos)
      ansible.builtin.debug:
        msg:
          USER: "{{ ansible_env.USER | default('(n/d)') }}"
          HOME: "{{ ansible_env.HOME | default('(n/d)') }}"
          PATH: "{{ ansible_env.PATH | default('(n/d)') }}"
      tags:
        - env
        - debug
