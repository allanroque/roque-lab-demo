---
# ==============================================================================
# EDA Rulebook — Alertmanager Demo (escopo mínimo: SELinux + Disco)
# ==============================================================================
# Fluxo end-to-end:
#   Prometheus  →  Alertmanager  →  EDA :5050  →  AAP (Job Templates)
#
# Cenários cobertos nesta versão mínima:
#
#   ┌──────────────────────────┬──────────────┬───────────────────────────────┐
#   │ Alerta                   │ Severidade   │ Estratégia                    │
#   ├──────────────────────────┼──────────────┼───────────────────────────────┤
#   │ 1. HighFilesystemUsage   │ warning      │ Self-healing direto           │
#   │ 2. SELinuxDisabled       │ security     │ Workflow remediation SELinux  │
#   │                          │              │ (resolve encerra incident)    │
#   └──────────────────────────┴──────────────┴───────────────────────────────┘
#
# AAP chamados (todos em Organization: ROQUE):
#   • JT  SELF-HEALING-DISK-USAGE   — firing (disco)
#   • WF  WF-REMEDIATION-SELINUX    — firing (SELinux) — remediação + incident
#   • JT  SNOW-INCIDENT-CLOSE       — resolved (SELinux)
#
# Configuração esperada no Alertmanager (alertmanager/config.yml):
#   route:
#     receiver: webhook_receiver
#     group_by: ['alertname', 'instance']
#   receivers:
#     - name: 'webhook_receiver'
#       webhook_configs:
#         - url: 'http://<EDA>:5050/prometheus'
#           send_resolved: true
# ==============================================================================

- name: Alertmanager demo — SELinux + Disco (mínimo)
  hosts: localhost

  # ─────────────────────────────────────────────────────────────────────────
  # Event source: recebe webhook do Alertmanager e explode o payload em
  # um evento por alerta (data_alerts_path: alerts).
  # ─────────────────────────────────────────────────────────────────────────
  sources:
    - ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5050
        data_alerts_path: alerts
        data_host_path: labels.instance
        data_path_separator: .
        skip_original_data: true

  rules:

    # ═════════════════════════════════════════════════════════════════════
    # CENÁRIO 1 — HighFilesystemUsage (warning)
    # Estratégia: SELF-HEALING direto (sem approval para agilizar a demo)
    # Template : SELF-HEALING-DISK-USAGE (JT em org ROQUE)
    # ═════════════════════════════════════════════════════════════════════

    - name: "[C1·WARN] Disco alto → SELF-HEALING-DISK-USAGE"
      condition: >-
        event.alert.labels.alertname == "HighFilesystemUsage"
        and event.alert.status == "firing"
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.alert.labels.alertname
          - event.alert.labels.instance
          - event.alert.labels.mountpoint
      action:
        run_job_template:
          name: "SELF-HEALING-DISK-USAGE"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alert_name: "{{ event.alert.labels.alertname }}"
            severity: "{{ event.alert.labels.severity | default('warning') }}"
            host_alvo: "{{ event.alert.labels.instance }}"
            mountpoint: "{{ event.alert.labels.mountpoint | default('/') }}"
            summary: "{{ event.alert.annotations.summary | default('') }}"
            description: "{{ event.alert.annotations.description | default('') }}"
            trigger_source: "EDA+Alertmanager"

    - name: "[C1·WARN] Disco normalizado → log de resolução"
      condition: >-
        event.alert.labels.alertname == "HighFilesystemUsage"
        and event.alert.status == "resolved"
      action:
        debug:
          msg: >-
            [RESOLVED] HighFilesystemUsage em {{ event.meta.hosts }}
            mount={{ event.alert.labels.mountpoint | default('/') }}

    # ═════════════════════════════════════════════════════════════════════
    # CENÁRIO 2 — SELinuxDisabled (security)
    # Estratégia: WORKFLOW de remediação no AAP
    #             (abre incident → remedia SELinux → valida)
    # Workflow: WF-REMEDIATION-SELINUX (firing)
    # Template: SNOW-INCIDENT-CLOSE    (resolved)
    # ═════════════════════════════════════════════════════════════════════

    - name: "[C2·SEC] SELinux off → WF-REMEDIATION-SELINUX"
      condition: >-
        event.alert.labels.alertname == "SELinuxDisabled"
        and event.alert.status == "firing"
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.alertname
          - event.alert.labels.instance
      action:
        run_workflow_template:
          name: "WF-REMEDIATION-SELINUX"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alert_name: "{{ event.alert.labels.alertname }}"
            severity: "{{ event.alert.labels.severity | default('security') }}"
            host_alvo: "{{ event.alert.labels.instance }}"
            snow_short_description: >-
              [SRE/EDA] SELinux desabilitado em {{ event.alert.labels.instance }}
            snow_description: >-
              Alerta automático do Prometheus/Alertmanager indica que o SELinux
              foi desabilitado. Workflow de remediação disparado via EDA:
              abre incident no ServiceNow, executa remediação no host alvo e
              valida o estado final do SELinux.
              Detalhes: {{ event.alert.annotations.description | default('') }}
            snow_urgency: "2"
            snow_impact: "2"
            snow_category: "security"
            snow_subcategory: "configuration_drift"
            snow_assignment_group: "Security Operations"
            trigger_source: "EDA+Alertmanager"

    - name: "[C2·SEC] SELinux restaurado → SNOW-INCIDENT-CLOSE"
      condition: >-
        event.alert.labels.alertname == "SELinuxDisabled"
        and event.alert.status == "resolved"
      action:
        run_job_template:
          name: "SNOW-INCIDENT-CLOSE"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alert_name: "{{ event.alert.labels.alertname }}"
            host_alvo: "{{ event.alert.labels.instance }}"
            snow_close_notes: >-
              SELinux re-habilitado em {{ event.alert.labels.instance }}.
              Fechamento automático via EDA.
            snow_close_code: "Solved (Permanently)"
            trigger_source: "EDA+Alertmanager"

    # ═════════════════════════════════════════════════════════════════════
    # CATCH-ALL — Observabilidade de alertas não mapeados
    # Qualquer alerta que não bateu nas regras acima é logado para análise.
    # Útil durante a demo para mostrar que nenhum evento "se perde".
    # ═════════════════════════════════════════════════════════════════════

    - name: "[*] Alerta não roteado → log para análise"
      condition: >-
        event.alert is defined
        and event.alert.labels.alertname not in
            ["HighFilesystemUsage", "SELinuxDisabled"]
      action:
        debug:
          msg: >-
            [UNROUTED] alert={{ event.alert.labels.alertname | default('?') }}
            status={{ event.alert.status | default('?') }}
            host={{ event.meta.hosts | default('?') }}
            severity={{ event.alert.labels.severity | default('?') }}
