---
# ==============================================================================
# EDA Rulebook — SELinux Disabled Remediation
# ==============================================================================
# Objetivo:
#   Detectar o alerta SELinuxDisabled vindo do Alertmanager e disparar o
#   workflow WF-REMEDIATION-SELINUX para reabilitar o SELinux no host afetado.
#
# Fluxo:
#   Prometheus → Alertmanager → EDA :5050/prometheus → WF-REMEDIATION-SELINUX
# ==============================================================================

- name: SELinux Disabled — remediation
  hosts: localhost

  sources:
    - ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5050
        data_alerts_path: alerts
        data_host_path: labels.instance
        data_path_separator: .
        skip_original_data: true

  rules:

    - name: "SELinux Disabled - Firing"
      condition: event.alert.labels.alertname == "SELinuxDisabled" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-REMEDIATION-SELINUX"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alerta: "{{ event.alert.labels.alertname }}"
            hostname: "{{ event.alert.labels.instance }}"
