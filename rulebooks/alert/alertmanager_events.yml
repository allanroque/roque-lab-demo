---
# ==============================================================================
# EDA Rulebook — Alertmanager Events (visão geral / debug)
# ==============================================================================
# Objetivo:
#   Capturar TODOS os alertas vindos do Alertmanager e imprimi-los via debug,
#   sem executar nenhuma ação de remediação. Útil para ter uma visão de quais
#   alertas estão chegando ao EDA.
#
# Fluxo:
#   Prometheus → Alertmanager → EDA :5050/prometheus → debug (stdout)
#
# Configuração esperada no Alertmanager (alertmanager/config.yml):
#   route:
#     receiver: webhook_receiver
#     group_by: ['alertname', 'instance']
#   receivers:
#     - name: 'webhook_receiver'
#       webhook_configs:
#         - url: 'http://<EDA>:5050/prometheus'
#           send_resolved: true
# ==============================================================================

- name: Alertmanager events — visão geral dos alertas (sem ação)
  hosts: localhost

  sources:
    - ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5050
        data_alerts_path: alerts
        data_host_path: labels.instance
        data_path_separator: .
        skip_original_data: true

  rules:

    - name: "Print de qualquer alerta recebido do Alertmanager"
      condition: event.alert is defined
      action:
        debug:
          msg: >-
            [ALERT] name={{ event.alert.labels.alertname | default('?') }}
            status={{ event.alert.status | default('?') }}
            severity={{ event.alert.labels.severity | default('?') }}
            host={{ event.meta.hosts | default('?') }}
            instance={{ event.alert.labels.instance | default('?') }}
            summary={{ event.alert.annotations.summary | default('') }}
            description={{ event.alert.annotations.description | default('') }}
