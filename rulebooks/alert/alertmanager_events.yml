---
- name: Alertmanager events
  hosts: localhost

  sources:
    - ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5050
        data_alerts_path: alerts
        data_host_path: labels.instance
        data_path_separator: .
        skip_original_data: true

  rules:
    - name: "SELinux Disabled - Firing"
      condition: event.alert.labels.alertname == "SELinuxDisabled" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-REMEDIATION-SELINUX"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alerta: "{{ event.alert.labels.alertname }}"
            hostname: "{{ event.alert.labels.instance }}"

    - name: "AIOps Fallback — AppDown (sem automação prévia)"
      condition: event.alert.labels.alertname == "AppDown" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-AIOPS-ENRICHMENT"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alertname: "{{ event.alert.labels.alertname }}"
            target_host: "{{ event.alert.labels.instance }}"
            service_name: "{{ event.alert.labels.service | default('httpd') }}"
            alert_summary: "{{ event.alert.annotations.summary | default('AppDown firing') }}"

    # BEGIN AIOPS AUTO-LEARN: AppDown
    - name: "AUTO-LEARN — AppDown → AIOPS-DYN-INC0017650"
      condition: event.alert.labels.alertname == "AppDown" and event.alert.status == "firing"
      action:
        run_job_template:
          name: "AIOPS-DYN-INC0017650"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            target_host: "{{ event.alert.labels.instance }}"
            service_name: "httpd"
            alertname: "AppDown"
    # END AIOPS AUTO-LEARN: AppDown

    # ===== Closed-loop WF-AUTOHEAL (abre INC -> remedia -> fecha/anota) =====
    - name: "AutoHeal — ApacheDown"
      condition: event.alert.labels.alertname == "ApacheDown" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-AUTOHEAL-APACHE"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alertname: "{{ event.alert.labels.alertname }}"
            target_host: "{{ event.alert.labels.instance }}"
            sn_short_description: "{{ event.alert.annotations.summary | default('ApacheDown firing') }}"
            sn_description: "{{ event.alert.annotations.description | default('httpd indisponivel') }}"

    - name: "AutoHeal — PostgresDown"
      condition: event.alert.labels.alertname == "PostgresDown" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-AUTOHEAL-POSTGRESQL"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alertname: "{{ event.alert.labels.alertname }}"
            target_host: "{{ event.alert.labels.instance }}"
            sn_short_description: "{{ event.alert.annotations.summary | default('PostgresDown firing') }}"
            sn_description: "{{ event.alert.annotations.description | default('postgresql indisponivel') }}"

    - name: "AutoHeal — RsyslogDown"
      condition: event.alert.labels.alertname == "RsyslogDown" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-AUTOHEAL-RSYSLOG"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alertname: "{{ event.alert.labels.alertname }}"
            target_host: "{{ event.alert.labels.instance }}"
            sn_short_description: "{{ event.alert.annotations.summary | default('RsyslogDown firing') }}"
            sn_description: "{{ event.alert.annotations.description | default('rsyslog indisponivel') }}"

    - name: "AutoHeal — ChronyDown"
      condition: event.alert.labels.alertname == "ChronyDown" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-AUTOHEAL-CHRONY"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alertname: "{{ event.alert.labels.alertname }}"
            target_host: "{{ event.alert.labels.instance }}"
            sn_short_description: "{{ event.alert.annotations.summary | default('ChronyDown firing') }}"
            sn_description: "{{ event.alert.annotations.description | default('chronyd indisponivel') }}"

    - name: "AutoHeal — FirewalldDown"
      condition: event.alert.labels.alertname == "FirewalldDown" and event.alert.status == "firing"
      action:
        run_workflow_template:
          name: "WF-AUTOHEAL-FIREWALL"
          organization: "ROQUE"
          job_args:
            limit: "{{ event.meta.hosts }}"
          extra_vars:
            alertname: "{{ event.alert.labels.alertname }}"
            target_host: "{{ event.alert.labels.instance }}"
            sn_short_description: "{{ event.alert.annotations.summary | default('FirewalldDown firing') }}"
            sn_description: "{{ event.alert.annotations.description | default('firewalld indisponivel') }}"

    - name: "Print de qualquer alerta recebido do Alertmanager"
      condition: event.alert is defined
      action:
        debug:
          msg: >-
            [ALERT] name={{ event.alert.labels.alertname | default('?') }}
            status={{ event.alert.status | default('?') }}
            severity={{ event.alert.labels.severity | default('?') }}
            host={{ event.meta.hosts | default('?') }}
            instance={{ event.alert.labels.instance | default('?') }}
            summary={{ event.alert.annotations.summary | default('') }}
            description={{ event.alert.annotations.description | default('') }}
